<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D47A1">
    <title>Authenticating...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'system-ui', 'sans-serif'] },
                },
            },
        };
    </script>
</head>
<body class="min-h-screen bg-[#F5F9FC] font-sans antialiased flex items-center justify-center">
    <div class="text-center px-4">
        <p id="status" class="text-lg font-medium text-slate-700">Signing you in...</p>
    </div>

    <script>
        (async () => {
            const statusEl = document.getElementById('status');

            try {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');

                if (!accessToken) {
                    statusEl.textContent = 'No authentication token found. Redirecting...';
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                    return;
                }

                const parts = accessToken.split('.');
                if (parts.length !== 3) {
                    throw new Error('Invalid token format');
                }

                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));

                const res = await fetch('/auth/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: payload.sub,
                        email: payload.email,
                        full_name: payload.user_metadata?.full_name
                            || payload.user_metadata?.name
                            || (payload.email ? payload.email.split('@')[0] : 'User'),
                    }),
                });

                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const err = await res.json().catch(() => ({}));
                    statusEl.textContent = 'Login failed: ' + (err.detail || 'Unknown error');
                    statusEl.className = 'text-lg font-medium text-red-600';
                    setTimeout(() => { window.location.href = '/login'; }, 3000);
                }
            } catch (e) {
                statusEl.textContent = 'Error: ' + e.message;
                statusEl.className = 'text-lg font-medium text-red-600';
                setTimeout(() => { window.location.href = '/login'; }, 3000);
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="{{ request.state.locale|default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>{{ t('meta.auth') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } },
        };
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-white font-sans antialiased flex flex-col text-gf-text">
    <div class="flex flex-1 items-center justify-center px-4">
        <div class="text-center">
            <p id="status" class="text-lg font-medium text-gf-text-2">{{ t('auth_callback.signing_in') }}</p>
        </div>
    </div>
    <footer class="py-6 text-center text-xs text-gf-text-3 border-t border-gf-border">
        <p>{{ t('footer.copyright') }}</p>
        {% include "partials/lang_switcher.html" %}
    </footer>

    <script>
        const AUTH = {
            signingIn: {{ t('auth_callback.signing_in')|tojson }},
            noToken: {{ t('auth_callback.no_token')|tojson }},
            loginFailed: {{ t('auth_callback.login_failed')|tojson }},
            errPrefix: {{ t('auth_callback.error_prefix')|tojson }},
        };
        (async () => {
            const statusEl = document.getElementById('status');
            try {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');

                if (!accessToken) {
                    statusEl.textContent = AUTH.noToken;
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                    return;
                }

                const parts = accessToken.split('.');
                if (parts.length !== 3) throw new Error('Invalid token format');

                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));

                const res = await fetch('/auth/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: payload.sub,
                        email: payload.email,
                        full_name: payload.user_metadata?.full_name
                            || payload.user_metadata?.name
                            || (payload.email ? payload.email.split('@')[0] : 'User'),
                    }),
                });

                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const err = await res.json().catch(() => ({}));
                    statusEl.textContent = AUTH.loginFailed + (err.detail || 'Unknown error');
                    statusEl.style.color = 'var(--gf-red)';
                    setTimeout(() => { window.location.href = '/login'; }, 3000);
                }
            } catch (e) {
                statusEl.textContent = AUTH.errPrefix + e.message;
                statusEl.style.color = 'var(--gf-red)';
                setTimeout(() => { window.location.href = '/login'; }, 3000);
            }
        })();
    </script>
</body>
</html>

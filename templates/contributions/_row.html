<tr class="border-t border-slate-100 hover:bg-primary-container/20">
    <td class="px-6 py-3">{{ c.created_at[:10] if c.created_at is string else c.created_at.strftime('%Y-%m-%d') }}</td>
    <td class="px-6 py-3">
        <span class="rounded-full px-2.5 py-1 text-xs font-medium
            {% if c.contribution_type == 'regular' %}bg-primary-container text-primary-on-container
            {% elif c.contribution_type == 'extraordinary' %}bg-sky-100 text-sky-900
            {% else %}bg-slate-100 text-slate-700{% endif %}">
            {{ c.contribution_type }}
        </span>
    </td>
    <td class="px-6 py-3">{{ c.period_year }}-{{ "%02d"|format(c.period_month) }}</td>
    <td class="px-6 py-3 text-slate-600">{{ c.description or '-' }}</td>
    <td class="px-6 py-3 text-right font-medium text-primary-dark">${{ "%.2f"|format(c.amount) }}</td>
    {% if is_admin is defined and is_admin %}
    <td class="px-6 py-3">
        <button hx-delete="/api/contributions/{{ c.id }}"
                hx-confirm="Cancel this contribution?"
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="text-xs text-red-600 hover:text-red-800 hover:underline">
            Cancel
        </button>
    </td>
    {% endif %}
</tr>

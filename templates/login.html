<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D47A1">
    <title>Login - FONAFAHE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#1565C0',
                            dark: '#0D47A1',
                            light: '#42A5F5',
                            container: '#E3F2FD',
                            'on-container': '#0D47A1',
                        },
                    },
                    fontFamily: { sans: ['Roboto', 'system-ui', 'sans-serif'] },
                    boxShadow: {
                        md1: '0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15)',
                        md2: '0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15)',
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-[#F5F9FC] font-sans antialiased flex items-center justify-center px-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-md2">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-medium tracking-tight text-primary-dark">FONAFAHE</h1>
            <p class="mt-2 text-slate-600">Collaborative Funding System</p>
        </div>

        <button id="google-login"
            class="flex w-full items-center justify-center gap-3 rounded-full border border-slate-300 bg-white px-6 py-3 text-sm font-medium text-slate-800 shadow-sm transition hover:bg-slate-50 hover:shadow-md1">
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </button>

        <div id="error-msg" class="mt-4 hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></div>
        {% if app_env == 'development' %}
        <div id="debug-msg" class="mt-4 hidden rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 font-mono text-xs text-slate-600 break-all"></div>
        {% endif %}
    </div>

    <script>
        const supabaseUrl = '{{ supabase_url }}';
        const supabaseKey = '{{ supabase_key }}';
        const isDev = '{{ app_env }}' === 'development';

        const errorEl = document.getElementById('error-msg');
        const debugEl = document.getElementById('debug-msg');

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        function showDebug(msg) {
            if (isDev && debugEl) {
                debugEl.textContent = msg;
                debugEl.classList.remove('hidden');
            }
        }

        if (!supabaseUrl || supabaseUrl === '' || supabaseUrl.includes('your-project')) {
            showError('Supabase URL is not configured. Check your .env file (SUPABASE_URL).');
            showDebug('SUPABASE_URL = "' + supabaseUrl + '"');
        } else if (!supabaseKey || supabaseKey === '' || supabaseKey.includes('your-')) {
            showError('Supabase Key is not configured. Check your .env file (SUPABASE_KEY).');
            showDebug('SUPABASE_KEY = "' + supabaseKey.substring(0, 20) + '..."');
        } else {
            showDebug('Supabase URL: ' + supabaseUrl);
        }

        let client;
        try {
            client = window.supabase.createClient(supabaseUrl, supabaseKey);
        } catch (e) {
            showError('Failed to create Supabase client: ' + e.message);
        }

        document.getElementById('google-login').addEventListener('click', async () => {
            if (!client) {
                showError('Supabase client not initialized. Check your .env configuration.');
                return;
            }

            errorEl.classList.add('hidden');

            try {
                const { data, error } = await client.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/auth/callback'
                    }
                });

                if (error) {
                    showError('OAuth error: ' + error.message);
                    showDebug('Error details: ' + JSON.stringify(error));
                } else if (data?.url) {
                    showDebug('Redirecting to: ' + data.url);
                    window.location.href = data.url;
                }
            } catch (e) {
                showError('Unexpected error: ' + e.message);
                showDebug(e.stack || e.toString());
            }
        });
    </script>
</body>
</html>

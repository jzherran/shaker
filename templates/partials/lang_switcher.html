{% set _next = request.url.path ~ ('?' ~ request.url.query if request.url.query else '') %}
<div class="flex items-center justify-center gap-3 mt-4">
    <a href="/set-language?lang=en&amp;next={{ _next|next_q }}"
       class="inline-flex items-center gap-1.5 px-3 py-1 rounded text-xs transition
              {% if request.state.locale == 'en' %}bg-gf-blue-bg text-gf-blue font-medium{% else %}text-gf-text-3 hover:text-gf-text-2{% endif %}"
       title="{{ t('lang.en') }}" aria-label="{{ t('lang.en') }}">
        <span role="img" aria-hidden="true">🇺🇸</span> EN
    </a>
    <a href="/set-language?lang=es&amp;next={{ _next|next_q }}"
       class="inline-flex items-center gap-1.5 px-3 py-1 rounded text-xs transition
              {% if request.state.locale == 'es' %}bg-gf-blue-bg text-gf-blue font-medium{% else %}text-gf-text-3 hover:text-gf-text-2{% endif %}"
       title="{{ t('lang.es') }}" aria-label="{{ t('lang.es') }}">
        <span role="img" aria-hidden="true">🇪🇸</span> ES
    </a>
</div>

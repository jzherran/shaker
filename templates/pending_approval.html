{% extends "base.html" %}
{% block title %}{{ t('meta.pending_approval') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="gf-card p-6 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full" style="background: var(--gf-amber-bg);">
            <svg class="h-7 w-7" style="color: var(--gf-amber);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h2 class="gf-page-title mb-2">{{ t('pending_approval.title') }}</h2>
        <p class="text-sm text-gf-text-2 mb-6">{{ t('pending_approval.body') }}</p>
        <div class="rounded p-3 text-sm" style="background: var(--gf-amber-bg); color: var(--gf-amber);">
            {{ t('pending_approval.hint') }}
        </div>
        <a href="/auth/logout" class="mt-6 inline-block gf-btn gf-btn-outline">{{ t('nav.logout') }}</a>
    </div>
</div>
{% endblock %}

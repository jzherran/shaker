{% extends "base.html" %}
{% block title %}{{ t('meta.reports_balance') }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-medium text-slate-900 mb-6">{{ t('reports.balance_title') }}</h1>

<div class="md-card p-6 mb-6 rounded-xl">
    <form id="report-form" class="flex flex-wrap gap-4 items-end">
        <div>
            <label class="block text-xs text-gray-500 mb-1">{{ t('reports.account') }}</label>
            <select id="account_id" class="border rounded px-3 py-2 text-sm">
                {% for a in accounts %}
                <option value="{{ a.id }}">{{ a.owner_name or a.account_number }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">{{ t('reports.type') }}</label>
            <select id="snapshot_type" class="border rounded px-3 py-2 text-sm">
                <option value="daily">{{ t('reports.daily') }}</option>
                <option value="monthly" selected>{{ t('reports.monthly') }}</option>
                <option value="yearly">{{ t('reports.yearly') }}</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">{{ t('reports.from') }}</label>
            <input type="date" id="date_from" class="border rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">{{ t('reports.to') }}</label>
            <input type="date" id="date_to" class="border rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="rounded-full bg-primary px-5 py-2 text-sm font-medium text-white shadow-md1 hover:bg-primary-dark transition">{{ t('reports.load') }}</button>
    </form>
</div>

<div id="report-data" class="md-card overflow-hidden rounded-xl">
    <p class="px-6 py-8 text-center text-slate-500">{{ t('reports.hint') }}</p>
</div>

<script>
    const RB = {
        err: {{ t('reports.error_load')|tojson }},
        empty: {{ t('reports.no_snapshots')|tojson }},
        colDate: {{ t('reports.col_date')|tojson }},
        colBalance: {{ t('reports.col_balance')|tojson }},
        colContrib: {{ t('reports.col_contributions')|tojson }},
        colDisb: {{ t('reports.col_disbursements')|tojson }},
        colPay: {{ t('reports.col_payments')|tojson }},
    };
    document.getElementById('report-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const params = new URLSearchParams({
            account_id: document.getElementById('account_id').value,
            snapshot_type: document.getElementById('snapshot_type').value,
        });
        const from = document.getElementById('date_from').value;
        const to = document.getElementById('date_to').value;
        if (from) params.set('date_from', from);
        if (to) params.set('date_to', to);

        const res = await fetch('/api/reports/balance?' + params);
        const container = document.getElementById('report-data');

        if (!res.ok) {
            container.innerHTML = '<p class="px-6 py-8 text-center text-red-500">' + RB.err + '</p>';
            return;
        }

        const data = await res.json();
        if (!data.length) {
            container.innerHTML = '<p class="px-6 py-8 text-center text-slate-500">' + RB.empty + '</p>';
            return;
        }

        let html = '<table class="w-full text-sm"><thead class="bg-slate-50/80"><tr class="text-left text-slate-600">';
        html += '<th class="px-6 py-3">' + RB.colDate + '</th><th class="px-6 py-3">' + RB.colBalance + '</th>';
        html += '<th class="px-6 py-3">' + RB.colContrib + '</th><th class="px-6 py-3">' + RB.colDisb + '</th>';
        html += '<th class="px-6 py-3">' + RB.colPay + '</th></tr></thead><tbody>';

        data.forEach(s => {
            html += '<tr class="border-t border-slate-100">';
            html += '<td class="px-6 py-3">' + s.snapshot_date + '</td>';
            html += '<td class="px-6 py-3 font-medium text-primary-dark">$' + s.balance.toFixed(2) + '</td>';
            html += '<td class="px-6 py-3 text-primary">$' + s.total_contributions.toFixed(2) + '</td>';
            html += '<td class="px-6 py-3 text-amber-700">$' + s.total_loan_disbursements.toFixed(2) + '</td>';
            html += '<td class="px-6 py-3 text-sky-700">$' + s.total_loan_payments.toFixed(2) + '</td>';
            html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    });
</script>
{% endblock %}

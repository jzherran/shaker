{% extends "base.html" %}
{% block title %}{{ t('meta.reports_balance') }}{% endblock %}

{% block content %}
<h1 class="gf-page-title mb-6">{{ t('reports.balance_title') }}</h1>

<div class="gf-card p-5 mb-6">
    <form id="report-form" class="flex flex-wrap gap-4 items-end">
        <div>
            <label class="gf-label">{{ t('reports.account') }}</label>
            <select id="account_id" class="gf-select" style="width: auto; min-width: 200px;">
                {% for a in accounts %}
                <option value="{{ a.id }}">{{ a.owner_name or a.account_number }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="gf-label">{{ t('reports.type') }}</label>
            <select id="snapshot_type" class="gf-select" style="width: auto;">
                <option value="daily">{{ t('reports.daily') }}</option>
                <option value="monthly" selected>{{ t('reports.monthly') }}</option>
                <option value="yearly">{{ t('reports.yearly') }}</option>
            </select>
        </div>
        <div>
            <label class="gf-label">{{ t('reports.from') }}</label>
            <input type="date" id="date_from" class="gf-input" style="width: auto;">
        </div>
        <div>
            <label class="gf-label">{{ t('reports.to') }}</label>
            <input type="date" id="date_to" class="gf-input" style="width: auto;">
        </div>
        <button type="submit" class="gf-btn gf-btn-primary">{{ t('reports.load') }}</button>
    </form>
</div>

{# ── Chart ── #}
<div id="chart-container" class="gf-card p-5 mb-6 hidden">
    <div class="gf-chart-container">
        <canvas id="balance-chart"></canvas>
    </div>
</div>

{# ── Table ── #}
<div id="report-data" class="gf-card overflow-hidden">
    <p class="gf-empty">{{ t('reports.hint') }}</p>
</div>

<script>
    const RB = {
        err: {{ t('reports.error_load')|tojson }},
        empty: {{ t('reports.no_snapshots')|tojson }},
        colDate: {{ t('reports.col_date')|tojson }},
        colBalance: {{ t('reports.col_balance')|tojson }},
        colContrib: {{ t('reports.col_contributions')|tojson }},
        colDisb: {{ t('reports.col_disbursements')|tojson }},
        colPay: {{ t('reports.col_payments')|tojson }},
    };

    let balanceChart = null;

    document.getElementById('report-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const params = new URLSearchParams({
            account_id: document.getElementById('account_id').value,
            snapshot_type: document.getElementById('snapshot_type').value,
        });
        const from = document.getElementById('date_from').value;
        const to = document.getElementById('date_to').value;
        if (from) params.set('date_from', from);
        if (to) params.set('date_to', to);

        const res = await fetch('/api/reports/balance?' + params, {
            credentials: 'same-origin',
        });
        const container = document.getElementById('report-data');
        const chartContainer = document.getElementById('chart-container');

        if (!res.ok) {
            chartContainer.classList.add('hidden');
            container.innerHTML = '<p class="gf-empty" style="color:var(--gf-red)">' + RB.err + '</p>';
            return;
        }

        const data = await res.json();
        if (!data.length) {
            chartContainer.classList.add('hidden');
            container.innerHTML = '<p class="gf-empty">' + RB.empty + '</p>';
            return;
        }

        // Chart
        chartContainer.classList.remove('hidden');
        const labels = data.map(s => s.snapshot_date);
        const balances = data.map(s => s.balance);
        const contributions = data.map(s => s.total_contributions);

        if (balanceChart) balanceChart.destroy();
        balanceChart = new Chart(document.getElementById('balance-chart'), {
            type: 'line',
            data: {
                labels,
                datasets: [
                    {
                        label: RB.colBalance,
                        data: balances,
                        borderColor: '#1a73e8',
                        backgroundColor: 'rgba(26,115,232,0.08)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#1a73e8',
                    },
                    {
                        label: RB.colContrib,
                        data: contributions,
                        borderColor: '#137333',
                        backgroundColor: 'transparent',
                        borderDash: [5, 3],
                        tension: 0.3,
                        pointRadius: 2,
                        pointBackgroundColor: '#137333',
                    },
                ],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', labels: { font: { size: 12, family: 'Inter' }, color: '#5f6368', usePointStyle: true, pointStyle: 'circle' } },
                    tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + formatCOP(ctx.raw) } },
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#80868b' } },
                    y: { grid: { color: '#e8eaed' }, ticks: { font: { size: 11 }, color: '#80868b', callback: v => formatCOP(v) } },
                },
            },
        });

        // Table
        let html = '<table class="gf-table"><thead><tr>';
        html += '<th>' + RB.colDate + '</th><th>' + RB.colBalance + '</th>';
        html += '<th>' + RB.colContrib + '</th><th>' + RB.colDisb + '</th>';
        html += '<th>' + RB.colPay + '</th></tr></thead><tbody>';

        data.forEach(s => {
            html += '<tr>';
            html += '<td class="text-gf-text-2">' + s.snapshot_date + '</td>';
            html += '<td class="font-medium">' + formatCOP(s.balance) + '</td>';
            html += '<td class="gf-positive">' + formatCOP(s.total_contributions) + '</td>';
            html += '<td style="color:var(--gf-amber)">' + formatCOP(s.total_loan_disbursements) + '</td>';
            html += '<td class="text-gf-blue">' + formatCOP(s.total_loan_payments) + '</td>';
            html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    });
</script>
{% endblock %}
